name: 🔒 Security Regression Tests

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Niveau de sévérité bloquant'
        required: false
        default: 'CRITICAL'
        type: choice
        options: [ CRITICAL, HIGH, MEDIUM, LOW, NONE ]

jobs:
  security-scan:
    name: 🔍 Security Analysis & Test Generation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    permissions:
      contents: read

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html

      - name: 📁 Create output directories
        run: |
          mkdir -p tests/generated
          mkdir -p tests/results
          mkdir -p reports

      - name: 🔍 Run Security Analysis
        id: security_scan
        run: |
          FAIL_ON="${{ github.event.inputs.fail_on || 'CRITICAL' }}"
          echo "fail_on=$FAIL_ON" >> $GITHUB_OUTPUT
          python runner/run.py sample_app/ --fail-on $FAIL_ON
        continue-on-error: true

      - name: 🧪 Run Generated Tests
        id: run_tests
        run: |
          pytest tests/generated/ -v --tb=short || true

      - name: 📊 Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: 🧪 Upload Generated Tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-tests-${{ github.run_number }}
          path: tests/
          retention-days: 14

      - name: 🚦 Security Gate
        if: steps.security_scan.outcome == 'failure'
        run: |
          echo "=================================================="
          echo "❌ BUILD BLOQUÉ PAR LE SECURITY GATE"
          echo "Des vulnérabilités critiques ont été détectées."
          echo "Consultez l'artifact 'security-report' pour le détail."
          echo "=================================================="
          exit 1

      - name: ✅ Build Authorized
        if: steps.security_scan.outcome == 'success'
        run: |
          echo "=================================================="
          echo "✅ SECURITY GATE PASSED — Build autorisé"
          echo "=================================================="