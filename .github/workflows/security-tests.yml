name: 🔒 Security Regression Tests

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Niveau de sévérité bloquant'
        required: false
        default: 'CRITICAL'
        type: choice
        options: [ CRITICAL, HIGH, MEDIUM, LOW, NONE ]

jobs:
  security-scan:
    name: 🔍 Security Analysis & Test Generation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html

      # ── 4. Create output directories ─────────────────────────────
      - name: 📁 Create output directories
        run: |
          mkdir -p tests/generated
          mkdir -p tests/results
          mkdir -p reports

      # ── 5. Run Security Scanner ───────────────────────────────────
      - name: 🔍 Run Security Analysis
        id: security_scan
        run: |
          FAIL_ON="${{ github.event.inputs.fail_on || 'CRITICAL' }}"
          echo "fail_on=$FAIL_ON" >> $GITHUB_OUTPUT
          python runner/run.py sample_app/ --fail-on $FAIL_ON
        continue-on-error: true

      # ── 6. Upload HTML Report ─────────────────────────────────────
      - name: 📊 Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      # ── 7. Upload Generated Tests ─────────────────────────────────
      - name: 🧪 Upload Generated Tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-tests-${{ github.run_number }}
          path: tests/
          retention-days: 14

      # ── 8. Security Gate ──────────────────────────────────────────
      - name: 🚦 Security Gate — Block build if vulnerabilities found
        if: steps.security_scan.outcome == 'failure'
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "❌ BUILD BLOQUÉ PAR LE SECURITY GATE"
          echo "Des vulnérabilités de sévérité >= ${{ steps.security_scan.outputs.fail_on }} ont été détectées."
          echo "Consultez l'artifact 'security-report' pour le détail."
          echo "═══════════════════════════════════════════════════"
          exit 1

      # ── 9. Success ────────────────────────────────────────────────
      - name: ✅ Security Gate — Build authorized
        if: steps.security_scan.outcome == 'success'
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "✅ SECURITY GATE PASSED"
          echo "Aucune vulnérabilité bloquante détectée."
          echo "═══════════════════════════════════════════════════"
